<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Styling with ID Selectors</title>
    <style>
        /* ID selectors with required background and border styles */
        #yellow {
            background-color: yellow;
            border-width: 1px;
            border-color: green;
            border-style: solid;
        }
        
        #red {
            background-color: red;
            border-width: 1px;
            border-color: black;
            border-style: solid;
        }
        
        #green {
            background-color: green;
            border-width: 1px;
            border-color: yellow;
            border-style: solid;
        }
        
        /* Optional: Add some padding and margin for better readability */
        p {
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <p id="yellow">This paragraph has yellow background with 1px green border.</p>
    <p id="red">This paragraph has red background with 1px black border.</p>
    <p id="green">This paragraph has green background with 1px yellow border.</p>
</body>
</html>
